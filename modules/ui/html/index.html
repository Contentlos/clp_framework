<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>clp_framework — UI</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!--
        clp_framework UI-Container (Phase 0: leer / Skeleton).
        In Phase 4 werden hier Notify / Menu / Progressbar / Input gerendert.
    -->
    <div id="clp-root">
        <div id="clp-notify-stack" class="clp-stack" data-anchor="top-right"></div>
        <div id="clp-progress-stack" class="clp-stack" data-anchor="bottom-center"></div>
        <div id="clp-menu-stack" class="clp-stack" data-anchor="right"></div>
        <div id="clp-input-stack" class="clp-stack" data-anchor="center"></div>
    </div>
    <script src="script.js"></script>
</body>
</html>
